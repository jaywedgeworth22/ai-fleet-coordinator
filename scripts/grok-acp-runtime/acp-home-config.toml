# Stripped Grok home for pm2 grok-acp (--no-leader serve on :12419).
# TUI / grok-leader keep ~/.grok/config.toml and the full MCP set.
# This process must not auto-load kitchen-sink MCPs; session/new passes
# only the servers that seat asked for (opts.mcpServers).
# Copied to ~/apps/grok-acp-runtime/acp-home/config.toml on start.

[cli]
auto_update = false
use_leader = false

[models]
default = "grok-4.6"
web_search = "grok-4.5"
default_reasoning_effort = "high"

[compat.claude]
mcps = false
skills = false
rules = false
agents = false
hooks = false
sessions = false

[compat.cursor]
mcps = false
skills = false
rules = false
agents = false
hooks = false
sessions = false

[plugins]
enabled = []
disabled = []

[managed_mcps]
enabled = false
gateway_tools_enabled = false

[features]
telemetry = false
lsp_tools = false
codebase_indexing = false
