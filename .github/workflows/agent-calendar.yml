name: Agent Activity Calendar

on:
  schedule:
    # Every 6 hours (America/Chicago-friendly offsets)
    - cron: "20 1,7,13,19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-agent-calendar.py"
      - ".github/workflows/agent-calendar.yml"

permissions:
  contents: write

concurrency:
  group: agent-activity-calendar
  cancel-in-progress: true

jobs:
  build-ics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so the commit step can push with GITHUB_TOKEN
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ICS feed
        env:
          # Prefer a PAT that can read private fleet repos (Congress.Trade).
          # Falls back to GITHUB_TOKEN (public repos + this repo).
          FLEET_GITHUB_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEET_OWNER: jaywedgeworth22
          FLEET_REPOS: Socratic.Trade,Congress.Trade,Usage-Monitor,congress-trading-shared,ai-fleet-coordinator
          CALENDAR_LOOKBACK_DAYS: "21"
          CALENDAR_PER_REPO: "50"
          CALENDAR_OUT: calendar/agent-activity.ics
        run: python3 scripts/build-agent-calendar.py

      - name: Commit feed if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar/agent-activity.ics
          if git diff --cached --quiet; then
            echo "No calendar changes."
            exit 0
          fi
          git commit -m "chore(calendar): refresh agent activity ICS [skip ci]"
          git push
